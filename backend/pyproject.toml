[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "week-planner-backend"
version = "0.1.0"
description = "Серверная часть личного планировщика недели"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.122,<1.0",
  "uvicorn[standard]>=0.38,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.18,<2.0",
  "pydantic>=2.11,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.0,<7.0",
]

[project.scripts]
planner-server = "planner.main:run"
planner-db = "planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["planner"]
